plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.hung.wdcloud'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.hung.wdcloud'
        minSdk 26          // Android 8.0 trở lên (thư viện mã hoá BouncyCastle cần)
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Không ký ở đây: ký ngoài bằng tools/sign_apk.py, khoá ký không để trong repo
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES',
                         'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST']
        }
    }

    testOptions {
        unitTests.all {
            testLogging {
                events 'passed', 'failed', 'skipped'
                exceptionFormat 'full'
                showStandardStreams true
            }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}

dependencies {
    implementation 'com.hierynomus:smbj:0.13.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    testImplementation 'junit:junit:4.13.2'
}
