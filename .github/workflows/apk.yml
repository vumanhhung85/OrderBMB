# Dựng APK WD Cloud (nhánh wdcloud của repo OrderBMB, không đụng nhánh main).
# 1) Dựng máy chủ Samba thật có 2 thư mục chia sẻ, chạy test phần lõi SMB (chép/chuyển/xoá/liệt kê share...).
# 2) Build APK. Kết quả: bản CHƯA KÝ ở Release "wdcloud-apk"; ký ngoài bằng tools/sign_apk.py (khoá không để trong repo).
name: Build APK
on:
  push:
    branches: [wdcloud]
    paths: ['app/**', '*.gradle', 'gradle.properties', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SMB_HOST: 127.0.0.1
      SMB_USER: wdtest
      SMB_PASS: 'Wd@12345'
      SMB_SHARE1: DungChung
      SMB_SHARE2: KhoAnh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Samba test server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq samba >/dev/null
          sudo useradd -M -s /usr/sbin/nologin wdtest || true
          printf '%s\n%s\n' "$SMB_PASS" "$SMB_PASS" | sudo smbpasswd -a -s wdtest
          sudo mkdir -p /srv/smb/DungChung /srv/smb/KhoAnh
          sudo chown -R wdtest /srv/smb
          printf '[DungChung]\n path = /srv/smb/DungChung\n read only = no\n valid users = wdtest\n[KhoAnh]\n path = /srv/smb/KhoAnh\n read only = no\n valid users = wdtest\n' | sudo tee -a /etc/samba/smb.conf >/dev/null
          sudo systemctl restart smbd
          smbd --version
      - name: Test + Build
        run: |
          set -o pipefail
          if ! gradle --no-daemon --stacktrace testReleaseUnitTest assembleRelease 2>&1 | tee build.log; then
            grep -E "error:|e: |What went wrong|Could not|FAILED|Exception|expected" -A3 build.log | head -80 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
      - name: Classpath for offline checking
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view wdcloud-deps >/dev/null 2>&1 && exit 0
          mkdir -p deps
          find ~/.gradle/caches/modules-2/files-2.1 \( -path '*hierynomus*' -o -path '*bouncycastle*' -o -path '*slf4j*' -o -path '*mbassador*' -o -path '*junit*' -o -path '*hamcrest*' \) -name '*.jar' ! -name '*sources*' -exec cp {} deps/ \;
          cp "$ANDROID_HOME/platforms/android-34/android.jar" deps/ || true
          ls deps
          zip -j -q deps.zip deps/*
          gh release create wdcloud-deps deps.zip --prerelease --title "Thư viện để kiểm tra biên dịch" --notes "Không dùng để cài."
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk WDCloud-unsigned.apk
          gh release delete wdcloud-apk -y --cleanup-tag || true
          gh release create wdcloud-apk WDCloud-unsigned.apk --target "${{ github.sha }}" --prerelease \
            --title "APK build (chưa ký) ${{ github.sha }}" --notes "Bản dựng tự động, chưa ký — không cài trực tiếp."
